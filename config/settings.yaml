# Single source of truth for assumptions. Values marked DECIDE need team sign-off (log in docs/DECISIONS.md).
universe: [SPY, EFA, EEM, AGG, GLD, XLE, XLK]
portfolio_value_usd: 10000000
data:
  snapshot: yahoo_adj_close_2026-10-20.csv   # data/raw/; the committed source of truth
  download_start: "1993-01-29"               # SPY inception; common sample starts at GLD (2004-11-18)
  download_end: "2026-10-20"                 # exclusive
  price_field: adj_close                     # yfinance auto_adjust=False, 'Adj Close'
  income_snapshot:                           # data/raw/; unadjusted close + cash distributions
    close: yahoo_close_2026-10-28.csv
    dividends: yahoo_dividends_2026-10-28.csv
  fred_snapshots:                            # data/external/; refresh with --refresh-data
    DTB3: fred_DTB3_2026-10-28.csv           # risk-free (3M T-bill)
    DGS10: fred_DGS10_2026-10-28.csv         # 10y Treasury yield
    CPIAUCSL: fred_CPIAUCSL_2026-10-28.csv   # CPI (monthly)
    T10YIE: fred_T10YIE_2026-10-28.csv       # 10y breakeven inflation (market expectation)
    T5YIE: fred_T5YIE_2026-10-28.csv         # 5y breakeven inflation
  fred_max_stale_days: 5                     # max business days to carry a FRED value forward
  outlier_z_threshold: 5.0                   # full-sample z audit (original T2 rule)
  quality:                                   # extra checks, brief p.9; flag only
    stale_min_run: 3                         # >= 3 consecutive unchanged prices
    jump_k: 6.0                              # |r_t| > 6 x past-only rolling sigma
    jump_window: 63                          # ~3 months of trading days
    large_negative_floor: -0.10              # single-day simple return below -10%
  adf_alpha: 0.05
  start: "2004-11-18"                       # D1, APPROVED: common sample start (GLD inception)
  end: "2026-10-19"                         # D1: snapshot end
  risk_free_series: DTB3                     # D2, APPROVED
split:                          # D5, APPROVED 2026-10-28; chronological, no overlap
  train_end: "2014-12-31"
  validation_end: "2019-12-31"     # test = 2020-01-01 onwards, used once
conventions:                    # D17 (approved)
  trading_days_per_year: 252
  loss_sign: positive_is_loss   # loss = -return
  portfolio_returns: simple     # sum_i w_i * simple return_i; log returns only per asset
risk:
  confidence_levels: [0.90, 0.95, 0.99]   # D18: app 90/95/99, report 95/99
  report_confidence_levels: [0.95, 0.99]
  horizon_days: 1                         # D17: primary, backtestable
  strategic_horizon_years: 5              # D4, APPROVED: annual review
  backtest_window_days: 1000              # D13, APPROVED (sensitivity 500)
  backtest_window_sensitivity_days: 500
  mc_distribution: student_t              # D19: multivariate t or t-copula, never plain normal
  mc_simulations: 100000                  # t-copula + empirical marginals (D19); seed below
  bootstrap_reps: 1000                    # historical / normal intervals (D18)
  bootstrap_reps_t: 100                   # Student-t refits are slow
  p2_portfolios: [d26_selected, min_variance, min_cvar, risk_parity, max_sharpe]  # target_return = min_variance; max_expected ≈ max_sharpe
  random_seed: 42
validation:                     # T10 backtesting (D13 window above)
  portfolios_from: p1_train     # weights chosen with data <= 2014 only: no look-ahead in 2015-2026
  confidence_levels: [0.95, 0.99]
  methods: [historical, normal, student_t, evt, garch_t, garch_evt, monte_carlo]
  refit_days: 21                # GARCH and Monte Carlo copula refit; sigma updated daily
  mc_simulations: 20000         # per refit (rolling; full-size 100k used in the risk stage)
  evt_threshold_q: 0.90         # D8 result
  significance: 0.05            # Kupiec / Christoffersen
  selection_rule: kupiec_basel_gate_then_fz0   # D28, APPROVED 2026-10-29 (validation data only, T10.07)
  selected_model: garch_evt     # D28 result, frozen 2026-10-29 before the test period
  test_unlocked: true           # D28 approved; test period run once 2026-10-29
stress:                         # T11
  windows:                      # S&P 500 peak-to-trough dates (T11.01); taper tantrum = 10y yield jump
    GFC 2007-09: ["2007-10-09", "2009-03-09"]
    Taper tantrum 2013: ["2013-05-02", "2013-06-24"]
    COVID 2020: ["2020-02-19", "2020-03-23"]
    Rates and inflation 2022: ["2022-01-03", "2022-10-12"]
  hypothetical:                 # D9, APPROVED 2026-10-29: stagflation shock over one quarter
    name: Stagflation shock
    factor_shock: {SPY: -0.25, dgs10_pct: 2.0, breakeven_10y_pct: 1.0}   # equities -25%, 10y +200bp, breakeven +100bp
    overrides: {}               # primary: factor betas only (hedges get no credit)
    variant_name: Stagflation with oil and gold spike
    variant_overrides: {XLE: 0.30, GLD: 0.10}   # sensitivity: 2022-style energy rally, gold as inflation hedge
risk_limits:                    # D7, APPROVED 2026-10-28
  max_drawdown: 0.25            # historical incl. 2008 replay
  max_prob_drawdown_breach_5y: 0.05   # P(DD > 25% within 5y), block bootstrap with CAPM means
  es99_1d_max: 0.025            # % NAV, full-cycle history (construction limit, binding)
  var99_1d_max: 0.017           # = ~0.67 x ES99 limit (observed VaR99/ES99 ratio 0.67-0.70), binding
  es95_1d_max: 0.0145           # reported limit, consistent with ES99
  var95_1d_max: 0.009           # reported limit; also used for backtest monitoring
  stress_loss_max: 0.25         # each historical / hypothetical scenario
  min_agg_weight_liquidity: 0.08      # >= 2 years of 4% spending
  # component_es_max: see constraints (D27)
  action_ladder:                # D23, APPROVED: drawdown from peak -> action (no forced selling)
    watch: {drawdown: 0.10, rolling_es99: 0.020, action: report to committee}
    review: {drawdown: 0.15, basel_zone: yellow, action: committee check of model, stress and spending}
    act: {drawdown: 0.20, rolling_es99: 0.025, action: formal decision - keep / reduce risk at next rebalance / adjust spending}
    limit: {drawdown: 0.25, basel_zone: red, action: mandatory decision - accept / adjust risk limit / reject}
  monitoring:                   # review triggers, not forced sales
    rolling_es_window: 250
    basel_zones_review: [yellow, red]
constraints:                    # D6 v2, APPROVED 2026-10-28 (docs/research/D3_D7_benchmarks_and_risk_limits.md §5c)
  long_only: true
  fully_invested: true          # D10: weights sum to 1 across the 7 ETFs, no cash or derivatives
  groups:                       # L2 strategic ranges
    equity: {tickers: [SPY, EFA, EEM, XLE, XLK], min: 0.20, max: 0.45}
    gold: {tickers: [GLD], min: 0.0, max: 0.20}
    sector_tilts: {tickers: [XLE, XLK], min: 0.0, max: 0.15}
  max_weight:                   # L3: 2x policy-benchmark weight; sector tilts 10%
    SPY: 0.50
    EFA: 0.20
    EEM: 0.10
    AGG: 1.00                   # bounded by equity/gold ranges (>= 35% implied)
    GLD: 0.20
    XLE: 0.10
    XLK: 0.10
  min_weight: 0.0               # no minimum weights
  component_es_max: 0.40        # D27, APPROVED 2026-10-29: no ETF > 40% of the D26 portfolio's 99% ES (L4)
optimiser:                      # D22, APPROVED 2026-10-28
  es_constraint: cvar           # Rockafellar-Uryasev linear programme
  drawdown_constraint: cdar     # conditional drawdown-at-risk (Chekhlov-Uryasev-Zabarankin)
  drawdown_fallback: post_check # reject candidates breaching D7 if CDaR is infeasible
benchmarks:                     # D3, APPROVED 2026-10-28. Frozen: do not tune to results
  capm_market: SPY
  rebalance: quarterly          # D11, APPROVED (portfolio and benchmarks)
  primary:                      # policy benchmark for IR / tracking error
    name: "Policy 40/50/10"
    weights: {SPY: 0.25, EFA: 0.10, EEM: 0.05, AGG: 0.50, GLD: 0.10}
  secondary:
    "60/40 SPY/AGG": {SPY: 0.60, AGG: 0.40}
    "Equal weight 7": {SPY: 0.142857142857, EFA: 0.142857142857, EEM: 0.142857142857, AGG: 0.142857142857, GLD: 0.142857142857, XLE: 0.142857142857, XLK: 0.142857142858}
mandate:                        # D12 inputs. Base values APPROVED 2026-10-28 (provisional); ranges = sensitivity. Change base + rerun `python run_all.py --only portfolio`
  inflation_series: breakeven_10y_pct          # FRED T10YIE on the as-of date
  spending_rate: {base: 0.04, range: [0.035, 0.04, 0.045, 0.05]}
  real_growth: {base: 0.005, range: [0.0, 0.005, 0.01]}
  extra_costs: {base: 0.002, range: [0.001, 0.002, 0.004]}   # costs not inside ETF prices
  spending_rule:                # D24, APPROVED: smoothed (Yale-type)
    type: smoothed
    weight_on_last_year: 0.70   # x last year's spending x (1 + inflation)
    weight_on_policy: 0.30      # x spending_rate.base x fund value
  withholding_tax:                              # base case: tax-exempt endowment; cases below are sensitivities
    base: none
    cases:                                      # rate on each ETF's distribution yield (non-US investor)
      "30% on equity ETFs, AGG interest exempt": {SPY: 0.30, EFA: 0.30, EEM: 0.30, XLE: 0.30, XLK: 0.30, AGG: 0.0, GLD: 0.0}
      "30% on all distributions (upper bound)":  {SPY: 0.30, EFA: 0.30, EEM: 0.30, XLE: 0.30, XLK: 0.30, AGG: 0.30, GLD: 0.0}
cma:                            # capital market assumptions (D12)
  market: SPY                   # CAPM market proxy (D3, approved)
  erp_base: 0.05                # D12, APPROVED 2026-10-28 (provisional)
  bond_assets: [AGG]            # D25, APPROVED: expected return = distribution yield on the as-of date
  covariance: ledoit_wolf_correlation   # T4.08: optimiser uses cma_*_cov_shrunk (variances kept, correlations shrunk)
  erp_range: [0.03, 0.04, 0.05, 0.06]
  rf_scenarios:                 # 5-year horizon (D4): today's T-bill may not last
    "current T-bill": as_of     # DTB3 on the as-of date (base)
    "3.0%": 0.030
    "2.5%": 0.025
  reference_portfolios:         # benchmarks / illustrations, not candidates
    "60/40 SPY/AGG": {SPY: 0.6, AGG: 0.4}
    "Equal weight 7": {SPY: 0.142857142857, EFA: 0.142857142857, EEM: 0.142857142857, AGG: 0.142857142857, GLD: 0.142857142857, XLE: 0.142857142857, XLK: 0.142857142858}
    "40/60 SPY/AGG": {SPY: 0.4, AGG: 0.6}
    "Defensive 30/50/20 SPY/AGG/GLD": {SPY: 0.3, AGG: 0.5, GLD: 0.2}
